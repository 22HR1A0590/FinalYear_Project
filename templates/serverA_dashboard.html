{% extends 'index.html' %}

{% block nav %}
<header id="header" class="header sticky-top">
    <div class="branding d-flex align-items-cente">

      <div class="container position-relative d-flex align-items-center justify-content-between">
        <a href="index.html" class="logo d-flex align-items-center">
          <!-- Uncomment the line below if you also wish to use an image logo -->
          <!-- <img src="assets/img/logo.png" alt=""> -->
          <h1 class="sitename">Privacy-Preserving Keyword Search</h1>
        </a>

        <nav id="navmenu" class="navmenu">
          <ul>
            <li><a href="{% url 'serverA_dashboard' %}">Home</a></li>
            <li><a href="{% url 'serverA_files' %}">View Files</a></li>
            <!-- <li><a href="{% url 'view_request' %}">View Request</a></li> -->
            <li><a href="{% url 'logout' %}">Logout</a></li>
          </ul>
          <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>

      </div>

    </div>

  </header>
{% block hero %}
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<section class="section d-flex align-items-center justify-content-center text-center"
    style="padding-top: 100px; padding-bottom: 150px; min-height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); font-family: 'Poppins', sans-serif; color: white;">

    <div class="container">
        <h1 style="font-size: 3rem; font-weight: 600;">👋 Welcome to Server-A Dashboard</h1>
        <p style="font-size: 1.25rem; margin-top: 15px;">Manage and monitor privacy-preserving file operations securely</p>
    </div>

    <style>
        .section h1, .section p {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</section>

    {% endblock %}
    {% endblock %}
