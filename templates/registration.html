{% extends "index.html" %}

{% block nav %}
{{ block.super }}
{% endblock %}

{% block hero %}
<style>
  body {
    font-family: 'Segoe UI', sans-serif;
  }

  .custom-bg {
    background-color: #f7f8fc;
    min-height: 100vh;
    background-image: url('https://www.transparenttextures.com/patterns/diamond-upholstery.png');
    background-size: cover;
    background-repeat: repeat;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    padding: 40px;
    transition: all 0.3s ease;
  }

  .glass-card:hover {
    transform: scale(1.01);
  }

  .form-control,
  .form-select {
    border-radius: 12px;
    border: 1px solid #ccc;
    background-color: #fff;
  }

  .form-control:focus,
  .form-select:focus {
    border-color: #4e54c8;
    box-shadow: 0 0 0 0.2rem rgba(78, 84, 200, 0.25);
  }

  .register-btn {
    background-color: #4e54c8;
    color: #fff;
    font-weight: 600;
    border-radius: 12px;
    padding: 10px 0;
    transition: background-color 0.3s ease;
  }

  .register-btn:hover {
    background-color: #373fc1;
  }

  .form-title {
    color: #4e54c8;
    font-weight: 700;
  }

  .text-muted a {
    color: #4e54c8;
    font-weight: 600;
    text-decoration: none;
  }

  .text-muted a:hover {
    text-decoration: underline;
  }
</style>

<section class="custom-bg d-flex align-items-center justify-content-center py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-10 col-lg-7">
        <div class="glass-card">
          <h2 class="text-center form-title mb-4">📝 User Registration</h2>
          {% if messages %}
          <div>
            {% for message in messages %}
            <p class="text-center">
              {{ message }}
            </p>
            {% endfor %}
          </div>
          {% endif %}
          <form method="POST" action="" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-floating mb-3">
              <input type="text" class="form-control" name="username" id="username" placeholder="Full Name" required>
              <label for="username">Full Name</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" name="email" id="email" placeholder="Email address" required>
              <label for="email">Email address</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
              <label for="password">Password</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control" name="conform_password" id="conform_password" placeholder="Confirm Password" required>
              <label for="conform_password">Confirm Password</label>
            </div>

            <div class="mb-4">
              <label for="role" class="form-label">Select Role</label>
              <select class="form-select" name="role" id="role" required>
                <option value="" selected disabled>-- Choose Role --</option>
                <option value="do">Data Owner</option>
                <option value="du">Data User</option>
              </select>
            </div>

            <!-- Contact Number -->
            <div class="form-floating mb-3">
              <input type="tel" class="form-control" name="contact" id="contact" placeholder="Contact Number" required>
              <label for="contact">Contact Number</label>
            </div>

            <!-- Address -->
            <div class="form-floating mb-3">
              <textarea class="form-control" name="address" id="address" placeholder="Address" style="height: 100px;" required></textarea>
              <label for="address">Address</label>
            </div>

            <!-- Profile Picture -->
            <div class="mb-4">
              <label for="profile" class="form-label">Profile Picture</label>
              <input type="file" class="form-control" name="profile" id="profile" accept="image/*" required>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn register-btn">Register</button>
            </div>
          </form>

          <div class="text-center text-muted mt-3">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
